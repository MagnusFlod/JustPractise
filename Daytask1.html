<!DOCTYPE html>
<html>
<head>
    <title>Document</title>

<body>

        <tr> for Row and 
            <td> for cells-->
    <h1>My new table</h1>
    <table>
        <tr>
            <th>Standard data</th>
            <th>Cool data</th>
            <th>Test</th>
        </tr>

            <td>Data 1</td>
            <td>
                <img src="https://i.imgur.com/3XjXQ.png" alt="Pikachu" width="100">

        </tr>
    </table>

</html>
